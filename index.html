    <!-- Immediate cache clearing for Comet Browser -->
    <script>
      (function() {
        const APP_VERSION = '28.2.0';
        const VERSION_KEY = 'pulse_app_version';
        const stored = localStorage.getItem(VERSION_KEY);

        // Only force an aggressive cache-clear + hard reload for an ACTUAL
        // upgrade: a *returning* visitor whose stored version differs from the
        // current one (they may be holding a corrupted old service worker /
        // cache — this is the Comet hotfix). A brand-new visitor (no stored
        // version) has nothing cached to bust, so we skip the clear+reload
        // entirely — it was costing every first impression a ~2s clear +
        // full double-load (via ?nocache=) for zero benefit.
        if (stored && stored !== APP_VERSION) {
          console.log('[PreCache] Version: ' + stored + ' -> ' + APP_VERSION + '. Forcing cache clear...');

          // Clear service workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (let registration of registrations) {
                registration.unregister();
                console.log('[PreCache] Unregistered service worker');
              }
            });
          }

          // Clear all caches
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) {
                caches.delete(name);
              }
              console.log('[PreCache] Deleted ' + names.length + ' caches');
            });
          }

          // Clear all storage
          localStorage.clear();
          sessionStorage.clear();

          // Set version marker
          localStorage.setItem(VERSION_KEY, APP_VERSION);

          console.log('[PreCache] Cache cleared! Reloading with cache-busting...');

          // Force hard reload with cache busting. Preserve the hash so deep
          // links (e.g. /features#section-crm) survive the one-time upgrade reload.
          if (!window.location.search.includes('nocache=')) {
            window.location.href = window.location.pathname + '?nocache=' + Date.now() + window.location.hash;
          }
        } else if (stored !== APP_VERSION) {
          // First-ever visit: nothing to clear, no reload — just record the
          // version so subsequent upgrades are detected.
          localStorage.setItem(VERSION_KEY, APP_VERSION);
        }
      })();
    </script>
