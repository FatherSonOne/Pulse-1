<style>
  /* ─── Pulse design tokens (mirrors src/styles/pulse-tokens.css) ─── */
  :root {
    --pulse-rose: #f43f5e;
    --pulse-rose-deep: #e11d48;
    --pulse-rose-bright: #fb7185;
    --pulse-rose-soft: rgba(244, 63, 94, 0.10);
    --pulse-rose-glow: rgba(244, 63, 94, 0.30);
    --pulse-tone-positive: #22c55e;
    --pulse-tone-positive-soft: rgba(34, 197, 94, 0.12);
    --pulse-tone-warning: #f97316;
    --pulse-tone-warning-soft: rgba(249, 115, 22, 0.12);
    --pulse-tone-info: #3b82f6;
    --pulse-tone-info-soft: rgba(59, 130, 246, 0.12);
    --pulse-tone-neutral: #6b7280;
    --pulse-canvas: #f8f8f8;
    --pulse-canvas-soft: #f2f2f2;
    --pulse-surface: #ffffff;
    --pulse-surface-raised: #f2f2f2;
    --pulse-border: rgba(0, 0, 0, 0.08);
    --pulse-border-strong: rgba(0, 0, 0, 0.16);
    --pulse-ink: #0f0f0f;
    --pulse-ink-2: #52525b;
    --pulse-ink-3: #6b7280;
    /* Coral = AI provenance ONLY. Same hex as rose, different semantic intent. */
    --pulse-coral: var(--pulse-rose);
    --pulse-coral-fg: color-mix(in oklab, var(--pulse-rose) 35%, black 65%);
    --pulse-coral-bg-12: color-mix(in oklab, var(--pulse-rose) 12%, transparent);
    --pulse-coral-bg-08: color-mix(in oklab, var(--pulse-rose) 8%, transparent);
    --pulse-font: 'Inter', system-ui, sans-serif;
    --pulse-mono: 'JetBrains Mono', ui-monospace, monospace;
    --pulse-sidebar-bg: #ffffff;
    --pulse-shadow-main: 0 6px 24px rgba(0, 0, 0, 0.08);
    /* Message bubbles — derived from ink so they flip correctly per theme,
       and are NEVER rose (the screenshot's coral-flood is the bug we fix). */
    --msg-recv-bg: var(--pulse-surface-raised);
    --msg-sent-bg: color-mix(in oklab, var(--pulse-ink) 9%, transparent);
  }
  html[data-theme='dark'] {
    --pulse-canvas: #000000;
    --pulse-canvas-soft: #080808;
    --pulse-surface: rgba(255, 255, 255, 0.03);
    --pulse-surface-raised: rgba(255, 255, 255, 0.055);
    --pulse-border: rgba(255, 255, 255, 0.06);
    --pulse-border-strong: rgba(255, 255, 255, 0.10);
    --pulse-ink: #fafafa;
    --pulse-ink-2: #b4b4b8;
    --pulse-ink-3: #a1a1aa;
    --pulse-coral-fg: color-mix(in oklab, var(--pulse-rose) 60%, white 40%);
    --pulse-rose: #fb7185;
    --pulse-rose-soft: rgba(244, 63, 94, 0.12);
    --pulse-sidebar-bg: #0a0a0b;
    --pulse-shadow-main: 0 10px 40px rgba(0, 0, 0, 0.4);
    --msg-sent-bg: color-mix(in oklab, var(--pulse-ink) 12%, transparent);
  }
  html, body { height: 100%; }
  body {
    font-family: var(--pulse-font);
    background: var(--pulse-canvas);
    color: var(--pulse-ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .pulse-bg { background: var(--pulse-canvas); }
  .pulse-bg-soft { background: var(--pulse-canvas-soft); }
  .pulse-surface { background: var(--pulse-surface); }
  .pulse-surface-raised { background: var(--pulse-surface-raised); }
  .pulse-ink-color { color: var(--pulse-ink); }
  .pulse-ink-2-color { color: var(--pulse-ink-2); }
  .pulse-ink-3-color { color: var(--pulse-ink-3); }
  .pulse-border-color { border-color: var(--pulse-border); }
  .pulse-border-strong-color { border-color: var(--pulse-border-strong); }
  .pulse-coral-fg-color { color: var(--pulse-coral-fg); }
  .pulse-coral-bg-color { background: var(--pulse-coral-bg-12); }
  .pulse-rose-color { color: var(--pulse-rose); }
  .pulse-rose-bg-color { background: var(--pulse-rose); }
  .pulse-rose-bg-soft-color { background: var(--pulse-rose-soft); }
  .pulse-rose-glow-shadow { box-shadow: 0 0 0 1px var(--pulse-rose), 0 4px 28px var(--pulse-rose-glow); }
  .font-mono-pulse { font-family: var(--pulse-mono); font-feature-settings: 'tnum' 1; }
  .tracking-wide-mono { letter-spacing: 0.16em; }
  .tracking-tight-mono { letter-spacing: 0.06em; }

  /* ─── Scrollbars ─── */
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--pulse-border-strong); border-radius: 3px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--pulse-ink-3); }

  /* ─── Motion ─── */
  @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
  .pulse-dot-anim { animation: pulseDot 1.4s ease-in-out infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 240ms cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes ghostBlink { 0%,100% { opacity: 0.55; } 50% { opacity: 0.85; } }

  /* ─── Message bubbles ─── */
  .bubble { max-width: 72%; border-radius: 16px; padding: 9px 13px; line-height: 1.45; font-size: 14px; }
  .bubble-them { background: var(--msg-recv-bg); border-top-left-radius: 5px; }
  .bubble-me   { background: var(--msg-sent-bg); border-top-right-radius: 5px; }
  html[data-theme='light'] .bubble-them { border: 1px solid var(--pulse-border); }

  .msg-row { transition: background 140ms ease; }
  .react-pill {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 7px 1px 5px; border-radius: 999px;
    background: var(--pulse-surface); border: 1px solid var(--pulse-border);
    font-size: 11px; line-height: 1.6;
  }

  /* ─── Thread rows ─── */
  .thread-row { transition: background 140ms ease; }
  .thread-row:hover { background: var(--pulse-surface-raised); }
  .thread-row[data-active='true'] { background: var(--pulse-surface-raised); }

  /* ─── Path B spine ─── */
  .spine-line { background: var(--pulse-border-strong); }
  .moment-card {
    border: 1px solid var(--pulse-border);
    background: var(--pulse-surface);
    border-radius: 12px;
  }

  /* ─── Path C ghost text + palette ─── */
  .ghost-text { color: color-mix(in oklab, var(--pulse-ink) 42%, transparent); animation: ghostBlink 2.4s ease-in-out infinite; }
  html[data-theme='light'] .ghost-text { color: color-mix(in oklab, var(--pulse-ink) 38%, transparent); }
  .cmd-card { background: var(--pulse-surface); border: 1px solid var(--pulse-border-strong); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
  .composer-focus { box-shadow: 0 0 0 1px var(--pulse-border-strong), 0 8px 32px rgba(0,0,0,0.18); }
  html[data-theme='dark'] .composer-focus { box-shadow: 0 0 0 1px var(--pulse-border-strong), 0 8px 40px rgba(0,0,0,0.55); }

  /* ─── Playground chrome ─── */
  .pg-bar { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .pg-pill { transition: background 180ms, color 180ms; }
  .pg-pill[data-active='true'] { background: var(--pulse-rose); color: white; }
  .pg-pill:not([data-active='true']):hover { background: var(--pulse-surface-raised); }

  /* ─── Honest placeholder ─── */
  .placeholder-block {
    background: repeating-linear-gradient(135deg, var(--pulse-border), var(--pulse-border) 4px, transparent 4px, transparent 8px);
  }
</style>
</head>

const AVATAR_PALETTE = ['#6366f1','#8b5cf6','#d946ef','#ec4899','#0ea5e9','#06b6d4','#14b8a6','#64748b'];
function colorForId(id = '') {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function initials(name = '') {
  return name.split(' ').filter(Boolean).slice(0, 2).map(s => s[0]).join('').toUpperCase() || '?';
}
const TONE_VAR = {
  positive: 'var(--pulse-tone-positive)',

  info:     'var(--pulse-tone-info)',
  neutral:  'var(--pulse-tone-neutral)',
};

    case 'calendar': return <svg viewBox="0 0 24 24" className={className} {...c}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;

    case 'check':    return <svg viewBox="0 0 24 24" className={className} {...c}><polyline points="20 6 9 17 4 12"/></svg>;
    case 'checkSquare': return <svg viewBox="0 0 24 24" className={className} {...c}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;

    case 'kebab':    return <svg viewBox="0 0 24 24" className={className} fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>;
    case 'plus':     return <svg viewBox="0 0 24 24" className={className} {...c}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case 'chevD':    return <svg viewBox="0 0 24 24" className={className} {...c}><polyline points="6 9 12 15 18 9"/></svg>;
    case 'chevR':    return <svg viewBox="0 0 24 24" className={className} {...c}><polyline points="9 6 15 12 9 18"/></svg>;
    case 'chevU':    return <svg viewBox="0 0 24 24" className={className} {...c}><polyline points="18 15 12 9 6 15"/></svg>;
    case 'x':        return <svg viewBox="0 0 24 24" className={className} {...c}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    case 'sun':      return <svg viewBox="0 0 24 24" className={className} {...c}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>;
    case 'moon':     return <svg viewBox="0 0 24 24" className={className} {...c}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>;
    case 'dot':      return <svg viewBox="0 0 24 24" className={className}><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>;
    case 'play':     return <svg viewBox="0 0 24 24" className={className}><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>;
    case 'bolt':     return <svg viewBox="0 0 24 24" className={className} {...c}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
    case 'clock':    return <svg viewBox="0 0 24 24" className={className} {...c}><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>;
    case 'help':     return <svg viewBox="0 0 24 24" className={className} {...c}><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    case 'logo':     return <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12h3l2-7 4 14 2-7h7"/></svg>;
    default:         return null;
  }
}

/* Shared: thread-list filter chips (mirrors real threadFilter: all/unread/pinned/with-tasks/with-decisions) */
const FILTERS = [
  { id: 'all',       label: 'All' },
  { id: 'unread',    label: 'Unread' },
  { id: 'pinned',    label: 'Pinned' },
  { id: 'tasks',     label: 'Tasks' },
  { id: 'decisions', label: 'Decisions' },
];
function filterThreads(id) {
  return THREADS.filter(t => {
    if (id === 'unread')    return t.unread > 0;
    if (id === 'pinned')    return t.pinned;
    if (id === 'tasks')     return t.tasks > 0;
    if (id === 'decisions') return t.decisions > 0;
    return true;
  });
}

function PathBRow({ m }) {
  const me = m.who === 'me';
  /* AI moment marker sits ON the spine before the message it was detected in */
  const moment = m.kind === 'decision'
    ? { tone: 'positive', icon: 'flag', label: 'DECISION DETECTED' }
    : m.kind === 'question'
    ? { tone: 'info', icon: 'help', label: 'OPEN QUESTION' }
    : null;

  return (
    <div className="relative pl-9 mb-3">
      {moment && (
        <div className="relative flex items-center gap-2 mb-2 fade-up">
          <span className="absolute -left-9 w-[30px] flex justify-center">
            <span className="w-5 h-5 rounded-full flex items-center justify-center" style={{ background: 'var(--pulse-canvas-soft)', border: `1.5px solid ${TONE_VAR[moment.tone]}` }}>
              <Icon name={moment.icon} className="w-2.5 h-2.5" />
            </span>
          </span>
          <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[9px] font-mono-pulse tracking-wide-mono"
            style={{ background: `color-mix(in oklab, ${TONE_VAR[moment.tone]} 14%, transparent)`, color: TONE_VAR[moment.tone] }}>
            <Icon name="sparkles" className="w-2.5 h-2.5"/>{moment.label}
          </span>
        </div>
      )}
      {/* dot on spine for ordinary messages */}
      {!moment && <span className="absolute left-[11px] top-2 w-2 h-2 rounded-full" style={{ background: 'var(--pulse-border-strong)' }}/>}

      <div className={`flex gap-2.5 ${me ? 'flex-row-reverse text-right' : ''}`}>
        {!me && <Avatar name="Frank Messana" size={26}/>}
        <div className={`flex-1 min-w-0 ${me ? 'pl-12' : 'pr-12'}`}>
          <div className={`flex items-baseline gap-2 ${me ? 'flex-row-reverse' : ''}`}>
            <span className="text-[12px] font-semibold pulse-ink-color">{me ? 'You' : 'Frank'}</span>
            <span className="text-[10px] font-mono-pulse pulse-ink-3-color">{m.t}</span>
            {m.needsReply && <span className="text-[9px] font-mono-pulse tracking-wide-mono px-1.5 py-0.5 rounded" style={{ background: TONE_VAR.warning, color: '#fff' }}>NEEDS REPLY</span>}
          </div>
          {m.replyTo && (
            <div className={`mt-1 inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] pulse-ink-3-color ${me ? 'flex-row-reverse' : ''}`} style={{ borderLeft: me ? '' : '2px solid var(--pulse-border-strong)', borderRight: me ? '2px solid var(--pulse-border-strong)' : '' }}>
              <span className="truncate max-w-[200px]">{m.replyTo.text}</span>
            </div>
          )}
          <div className="text-[15px] pulse-ink-color leading-relaxed mt-0.5">{m.text}</div>
          {m.reactions && (
            <div className={`flex gap-1 mt-1.5 ${me ? 'justify-end' : ''}`}>
              {m.reactions.map((r, i) => <span key={i} className="react-pill pulse-ink-2-color">{r.e}<span className="font-mono-pulse">{r.n}</span></span>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

          <div className="flex items-center gap-1 px-3 pb-2 overflow-x-auto">
            {FILTERS.map(f => (
              <button key={f.id} onClick={() => setFilter(f.id)}
                className={`px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition ${filter === f.id ? 'pulse-ink-color pulse-surface-raised' : 'pulse-ink-3-color hover:pulse-surface-raised'}`}>{f.label}</button>
            ))}
          </div>
          <div className="flex-1 overflow-y-auto px-2 pb-3">
            {threads.map(t => (
              <button key={t.id} data-active={t.active} className="thread-row w-full flex items-start gap-3 px-2.5 py-2.5 rounded-lg text-left">
                <div className="relative">
                  <Avatar name={t.name} size={40}/>
                  {t.online && <span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2" style={{ background: 'var(--pulse-tone-positive)', borderColor: 'var(--pulse-canvas-soft)' }}/>}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1.5">
                    {t.pinned && <Icon name="pin" className="w-3 h-3 pulse-ink-3-color"/>}
                    <span className={`text-sm truncate ${t.unread ? 'font-semibold pulse-ink-color' : 'font-medium pulse-ink-2-color'}`}>{t.name}</span>
                    <span className="ml-auto text-[10px] font-mono-pulse pulse-ink-3-color shrink-0">{t.t}</span>
                  </div>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    {t.voice && <Icon name="mic" className="w-3 h-3 pulse-ink-3-color shrink-0"/>}
                    {t.decisions > 0 && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: TONE_VAR.positive }}/>}
                    {t.tasks > 0 && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: TONE_VAR.warning }}/>}
                    <span className={`text-[12px] truncate ${t.unread ? 'pulse-ink-2-color' : 'pulse-ink-3-color'}`}>{t.preview}</span>
                    {t.unread > 0 && <span className="ml-auto shrink-0 min-w-[18px] h-[18px] px-1 rounded-full pulse-rose-bg-color text-white text-[10px] font-semibold flex items-center justify-center">{t.unread}</span>}
                  </div>
                </div>
              </button>
            ))}
          </div>
        </div>

        {/* ── Conversation (A's surface) ── */}
        <div className="flex flex-col min-h-0">
          <div className="px-5 py-3 border-b pulse-border-color flex items-center gap-3 shrink-0">
            <Avatar name="Frank Messana" size={36}/>
            <div className="leading-tight">
              <div className="text-sm font-semibold pulse-ink-color">Frank Messana</div>
              <div className="text-[11px] flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full" style={{ background: 'var(--pulse-tone-positive)' }}/><span className="pulse-ink-3-color">Active now · @frank</span></div>
            </div>
            <div className="ml-auto flex items-center gap-1 pulse-ink-3-color">
              <button onClick={() => setShowSummary(s => !s)} title="Thread summary"
                className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-[11px] font-medium transition ${showSummary ? 'pulse-coral-bg-color pulse-coral-fg-color' : 'hover:pulse-surface-raised'}`}>
                <Icon name="sparkles" className="w-3.5 h-3.5"/><span>Summary</span>
              </button>
              <button onClick={() => setShowPalette(true)} title="Command palette (⌘K)" className="flex items-center gap-1.5 px-2 py-1.5 rounded-md text-[11px] pulse-ink-3-color hover:pulse-surface-raised">
                <Icon name="search" className="w-3.5 h-3.5"/><span className="font-mono-pulse">⌘K</span>
              </button>
              <button onClick={() => setRailOpen(o => !o)} title={railOpen ? 'Hide relationship' : 'Show relationship'}
                className={`p-1.5 rounded-md transition ${railOpen ? 'pulse-surface-raised pulse-ink-2-color' : 'hover:pulse-surface-raised'}`}><Icon name="info" className="w-4 h-4"/></button>
            </div>
          </div>

          {showSummary && (
            <div className="mx-5 mt-3 rounded-xl pulse-coral-bg-color p-4 fade-up shrink-0" style={{ border: '1px solid var(--pulse-coral-fg)' }}>
              <div className="flex items-center gap-2 mb-2">
                <Icon name="sparkles" className="w-3.5 h-3.5 pulse-coral-fg-color"/>
                <span className="text-[10px] font-mono-pulse tracking-wide-mono pulse-coral-fg-color">PULSE AI · THREAD SUMMARY</span>
                <button onClick={() => setShowSummary(false)} className="ml-auto pulse-ink-3-color hover:pulse-ink-color"><Icon name="x" className="w-3.5 h-3.5"/></button>
              </div>
              <ul className="space-y-1.5">
                {AI_SUMMARY.map((s, i) => (
                  <li key={i} className="flex gap-2 text-[13px] pulse-ink-color leading-snug">
                    <span className="mt-1.5 w-1 h-1 rounded-full shrink-0" style={{ background: 'var(--pulse-coral-fg)' }}/><span>{s}</span>
                  </li>
                ))}
              </ul>
              <div className="text-[10px] font-mono-pulse pulse-ink-3-color mt-2.5">Summarized from 48 messages · just now</div>
            </div>
          )}

          {/* conversation — B's spine + AI moments (editorial reading) */}
          <div className="flex-1 overflow-y-auto px-6 py-4">
            {CONVO.map(group => (
              <div key={group.day} className="relative">
                <div className="absolute left-[15px] top-0 bottom-0 w-px spine-line" aria-hidden="true"/>
                <div className="relative flex items-center gap-3 my-4 pl-9">
                  <span className="text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color">{group.day.toUpperCase()}</span>
                </div>
                {group.msgs.map(m => <PathBRow key={m.id} m={m}/>)}
              </div>
            ))}
          </div>

          {/* composer — C's hero composer dropped into B: ghost + / palette + tone chip + rose send */}
          <div className="px-5 py-3 border-t pulse-border-color shrink-0 relative">
            {showSlash && (
              <div className="absolute bottom-full mb-1 left-5 right-5 cmd-card overflow-hidden fade-up">
                <div className="px-3 py-2 text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color border-b pulse-border-color">COMMANDS</div>
                {SLASH_COMMANDS.map((s, i) => (
                  <div key={s.cmd} className={`flex items-center gap-3 px-3 py-2 ${i === 0 ? 'pulse-surface-raised' : ''}`}>
                    <span className="font-mono-pulse text-[13px] pulse-ink-color w-24">{s.cmd}</span>
                    <span className="text-[12px] pulse-ink-3-color flex-1">{s.desc}</span>
                    {s.ai && <span className="px-1.5 py-0.5 rounded text-[9px] font-mono-pulse tracking-wide-mono pulse-coral-bg-color pulse-coral-fg-color">AI</span>}
                  </div>
                ))}
              </div>
            )}
            {/* tone chip — neutral warning, NOT coral (per spec) */}
            <div className="mb-2 flex items-center gap-2 px-3 py-1.5 rounded-lg" style={{ background: 'var(--pulse-tone-warning-soft)', border: '1px solid color-mix(in oklab, var(--pulse-tone-warning) 35%, transparent)' }}>
              <Icon name="bolt" className="w-3.5 h-3.5" style={{ color: 'var(--pulse-tone-warning)' }}/>
              <span className="text-[12px] pulse-ink-2-color">Reads a little terse for Frank — soften?</span>
              <button className="ml-auto text-[11px] font-medium px-2 py-0.5 rounded" style={{ background: 'var(--pulse-surface)', color: 'var(--pulse-ink)' }}>Apply</button>
              <button className="pulse-ink-3-color"><Icon name="x" className="w-3.5 h-3.5"/></button>
            </div>
            <div className="rounded-2xl pulse-surface composer-focus p-3">
              <div className="text-[15px] leading-relaxed pulse-ink-color">
                Pulling the War Room geo view together now — I’ll have it ready before 3.{' '}
                <span className="ghost-text">Want me to loop Maria in on the calendar invite?</span>
              </div>
              <div className="flex items-center gap-2 mt-3 pt-2.5 border-t pulse-border-color">
                <button onClick={() => setShowSlash(s => !s)} className="px-2 py-1 rounded-md text-[12px] font-mono-pulse pulse-ink-3-color hover:pulse-surface-raised" title="Slash commands">/</button>
                <button className="p-1.5 rounded-md hover:pulse-surface-raised pulse-ink-3-color"><Icon name="paperclip" className="w-4 h-4"/></button>
                <button className="p-1.5 rounded-md hover:pulse-surface-raised pulse-ink-3-color"><Icon name="smile" className="w-4 h-4"/></button>
                <span className="flex items-center gap-1.5 px-2 py-1 rounded-md text-[10px] font-mono-pulse tracking-wide-mono pulse-coral-bg-color pulse-coral-fg-color">
                  <Icon name="sparkles" className="w-3 h-3"/>PULSE AI · TAB TO ACCEPT
                </span>
                <div className="ml-auto flex items-center gap-2">
                  <button className="p-1.5 rounded-md hover:pulse-surface-raised pulse-ink-3-color"><Icon name="mic" className="w-4 h-4"/></button>
                  <button className="flex items-center gap-1.5 pl-3 pr-2.5 py-1.5 rounded-lg pulse-rose-bg-color text-white text-[13px] font-medium hover:pulse-rose-glow-shadow transition">
                    Send <span className="font-mono-pulse text-[10px] px-1 rounded bg-white/20">⌘↵</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* ── Collapsible relationship rail (B's intelligence, on demand) ── */}
        {railOpen && (
          <div className="border-l pulse-border-color flex flex-col min-h-0 overflow-y-auto fade-up">
            <div className="px-4 pt-4 pb-2 flex items-center gap-2">
              <div>
                <div className="text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color mb-0.5">RELATIONSHIP</div>
                <div className="text-[15px] font-semibold pulse-ink-color">Frank Messana</div>
              </div>
              <button onClick={() => setRailOpen(false)} className="ml-auto p-1 rounded-md hover:pulse-surface-raised pulse-ink-3-color"><Icon name="x" className="w-3.5 h-3.5"/></button>
            </div>

            <div className="px-4 pt-3">
              <div className="flex items-center gap-2 mb-2">
                <Icon name="checkSquare" className="w-3.5 h-3.5" style={{ color: TONE_VAR.warning }}/>
                <span className="text-[11px] font-semibold pulse-ink-2-color tracking-tight-mono font-mono-pulse">OPEN ITEMS · {OPEN_ITEMS.length}</span>
              </div>
              <div className="space-y-2">
                {OPEN_ITEMS.map(o => (
                  <div key={o.id} className="moment-card p-2.5">
                    <div className="flex items-start gap-2">
                      <span className="w-3.5 h-3.5 rounded border shrink-0 mt-0.5" style={{ borderColor: TONE_VAR.warning }}/>
                      <div className="min-w-0">
                        <div className="text-[12px] pulse-ink-color leading-snug">{o.text}</div>
                        <div className="text-[10px] font-mono-pulse pulse-ink-3-color mt-1">{o.owner} · due {o.due}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="px-4 pt-4">
              <div className="flex items-center gap-2 mb-2">
                <Icon name="flag" className="w-3.5 h-3.5" style={{ color: TONE_VAR.positive }}/>
                <span className="text-[11px] font-semibold pulse-ink-2-color tracking-tight-mono font-mono-pulse">LAST DECISION</span>
              </div>
              <div className="moment-card p-3" style={{ borderColor: 'color-mix(in oklab, var(--pulse-tone-positive) 40%, var(--pulse-border))' }}>
                <div className="text-[13px] pulse-ink-color leading-snug">{RELATIONSHIP.lastDecision}</div>
                <div className="text-[10px] font-mono-pulse pulse-ink-3-color mt-1.5">{RELATIONSHIP.lastDecisionWhen}</div>
              </div>
            </div>

            <div className="px-4 pt-4 pb-4">
              <div className="flex items-center gap-2 mb-2">
                <Icon name="clock" className="w-3.5 h-3.5 pulse-ink-3-color"/>
                <span className="text-[11px] font-semibold pulse-ink-2-color tracking-tight-mono font-mono-pulse">PACE</span>
              </div>
              <div className="moment-card p-3 space-y-2">
                <div className="flex items-center justify-between text-[12px]"><span className="pulse-ink-3-color">You reply in</span><span className="font-mono-pulse pulse-ink-color">{RELATIONSHIP.yourPace}</span></div>
                <div className="flex items-center justify-between text-[12px]"><span className="pulse-ink-3-color">Frank replies in</span><span className="font-mono-pulse pulse-ink-color">{RELATIONSHIP.theirPace}</span></div>
                <div className="h-px pulse-border-color border-t my-1"/>
                <div className="flex items-center justify-between text-[12px]"><span className="pulse-ink-3-color">Volume</span><span className="font-mono-pulse pulse-ink-3-color">{RELATIONSHIP.volume}</span></div>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* ⌘K command palette overlay (ported from Path C — the one C element that composes cleanly into Signal Thread) */}
      {showPalette && (
        <div className="absolute inset-0 z-30 flex items-start justify-center pt-[12vh]" style={{ background: 'rgba(0,0,0,0.4)', backdropFilter: 'blur(3px)' }} onClick={() => setShowPalette(false)}>
          <div className="w-[520px] cmd-card overflow-hidden fade-up" onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-3 px-4 py-3 border-b pulse-border-color">
              <Icon name="search" className="w-4 h-4 pulse-ink-3-color"/>
              <span className="text-sm pulse-ink-3-color flex-1">Search messages, people, or run a command…</span>
              <span className="font-mono-pulse text-[10px] pulse-ink-3-color px-1.5 py-0.5 rounded" style={{ background: 'var(--pulse-border)' }}>ESC</span>
            </div>
            <div className="py-1.5">
              <div className="px-4 py-1 text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color">ACTIONS</div>
              {[
                { icon: 'sparkles',    label: 'Summarize this thread',    ai: true,  k: '' },
                { icon: 'clock',       label: 'Schedule a message',       ai: false, k: '⌘⇧↵' },
                { icon: 'checkSquare', label: 'Create task from message', ai: false, k: '' },
                { icon: 'pin',         label: 'Pin to thread',            ai: false, k: '' },
              ].map((a, i) => (
                <div key={a.label} className={`flex items-center gap-3 px-4 py-2 ${i === 0 ? 'pulse-surface-raised' : ''}`}>
                  <Icon name={a.icon} className={`w-4 h-4 ${a.ai ? 'pulse-coral-fg-color' : 'pulse-ink-3-color'}`}/>
                  <span className="text-[13px] pulse-ink-color flex-1">{a.label}</span>
                  {a.ai && <span className="px-1.5 py-0.5 rounded text-[9px] font-mono-pulse tracking-wide-mono pulse-coral-bg-color pulse-coral-fg-color">AI</span>}
                  {a.k && <span className="font-mono-pulse text-[10px] pulse-ink-3-color px-1 rounded" style={{ background: 'var(--pulse-border)' }}>{a.k}</span>}
                </div>
              ))}
            </div>
            <div className="px-4 py-2 border-t pulse-border-color text-[10px] font-mono-pulse pulse-ink-3-color flex items-center gap-3">
              <span>↑↓ navigate</span><span>↵ select</span><span className="ml-auto">⌘K toggles</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   PLAYGROUND SHELL — top bar + path switcher + theme toggle
   ════════════════════════════════════════════════════════════════════════ */

function App() {
  const [theme, setTheme] = useState('dark');
  const [path, setPath] = useState('D');

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  return (
    <div className="h-screen w-screen flex flex-col overflow-hidden pulse-bg">
      <div className="pg-bar flex items-center gap-3 px-4 py-2 border-b pulse-border-color shrink-0" style={{ height: 48 }}>
        <div className="flex items-center gap-2">
          <div className="w-6 h-6 rounded-md pulse-rose-bg-color flex items-center justify-center text-white"><Icon name="mail" className="w-3.5 h-3.5"/></div>
          <span className="text-sm font-semibold pulse-ink-color">Messages Redesign</span>
          <span className="text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color">· PLAYGROUND</span>
        </div>

        <div className="ml-6 flex items-center gap-1 p-0.5 rounded-lg pulse-surface-raised">
          {[
            { id: 'A', label: 'A · Quiet Canvas' },
            { id: 'B', label: 'B · Signal Thread' },
            { id: 'C', label: 'C · Focus Composer' },
            { id: 'D', label: 'D · Signal Composer ★' },
          ].map(p => (
            <button key={p.id} data-active={path === p.id} onClick={() => setPath(p.id)}
              className="pg-pill px-3 py-1.5 rounded-md text-[12px] font-medium pulse-ink-2-color">{p.label}</button>
          ))}
        </div>

        <div className="ml-auto flex items-center gap-1">
          <button onClick={toggleTheme} className="px-2.5 py-1.5 rounded-md text-[11px] font-mono-pulse tracking-wide-mono pulse-ink-2-color hover:pulse-surface-raised flex items-center gap-1.5">
            <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-3.5 h-3.5"/>{theme === 'dark' ? 'LIGHT' : 'DARK'}
          </button>
        </div>
      </div>

      <div className="flex-1 flex overflow-hidden">
        <PulseSidebar theme={theme} onToggleTheme={toggleTheme}/>
        <main className="flex-1 overflow-hidden m-3 rounded-2xl border pulse-border-color pulse-bg-soft relative" style={{ boxShadow: 'var(--pulse-shadow-main)' }}>
          {path === 'A' && <PathA/>}
          {path === 'B' && <PathB/>}
          {path === 'C' && <PathC/>}
          {path === 'D' && <PathD/>}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
