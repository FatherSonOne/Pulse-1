  /* ─── Pulse design tokens (mirrors src/styles/pulse-tokens.css) ─── */

  /* ─── Motion ─── */
  @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }

    100% { box-shadow: 0 0 0 14px transparent; }
  }

  /* ─── Waveform (static) ─── */
  .wf { display: inline-flex; align-items: center; gap: 2px; }
  .wf > i {
    display: block;
    width: 2px;
    border-radius: 1px;
    background: currentColor;
    opacity: 0.55;
  }

  .selectable-row { transition: background 160ms ease; }
  .selectable-row:hover { background: var(--pulse-surface-raised); }
  .selectable-row[data-active='true'] { background: var(--pulse-coral-bg-08); }

  .studio-card {

  .pg-bar {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    backdrop-filter: blur(8px);

      var(--pulse-border),
      var(--pulse-border) 4px,
      transparent 4px,
      transparent 8px
    );
  }

const AVATAR_PALETTE = ['#6366f1','#8b5cf6','#d946ef','#ec4899','#0ea5e9','#06b6d4','#14b8a6','#64748b'];
function colorForId(id = '') {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function initials(name = '') {
  return name.split(' ').filter(Boolean).slice(0, 2).map(s => s[0]).join('').toUpperCase() || '?';
}

/** Deterministic waveform bars — same id always renders same shape. */
function waveformBars(seed, count = 40) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const bars = [];
  for (let i = 0; i < count; i++) {
    h = (h * 1664525 + 1013904223) >>> 0;
    const v = 0.18 + ((h % 1000) / 1000) * 0.82;
    bars.push(v);
  }
  return bars;
}

    case 'bookmark': return <svg viewBox="0 0 24 24" className={className} {...common}><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>;
    case 'chevR':    return <svg viewBox="0 0 24 24" className={className} {...common}><polyline points="9 6 15 12 9 18"/></svg>;
    case 'chevD':    return <svg viewBox="0 0 24 24" className={className} {...common}><polyline points="6 9 12 15 18 9"/></svg>;
    case 'sparkles': return <svg viewBox="0 0 24 24" className={className} {...common}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>;
    case 'sun':      return <svg viewBox="0 0 24 24" className={className} {...common}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>;
    case 'moon':     return <svg viewBox="0 0 24 24" className={className} {...common}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>;
    case 'dot':      return <svg viewBox="0 0 24 24" className={className}><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>;
    case 'volume':   return <svg viewBox="0 0 24 24" className={className} {...common}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>;
    case 'filter':   return <svg viewBox="0 0 24 24" className={className} {...common}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
    case 'plus':     return <svg viewBox="0 0 24 24" className={className} {...common}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case 'hash':     return <svg viewBox="0 0 24 24" className={className} {...common}><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>;
    case 'logo':     return <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12h3l2-7 4 14 2-7h7"/></svg>;
    default:         return null;
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WAVEFORM — static (with optional active fill)
   ════════════════════════════════════════════════════════════════════════ */

function Waveform({ seed, height = 24, count = 36, progress = 0, className = '', tall = false, color }) {
  const bars = useMemo(() => waveformBars(seed, count), [seed, count]);
  return (
    <span className={`wf ${tall ? 'wf-tall' : ''} ${className}`} style={{ height, color: color || 'currentColor' }}>
      {bars.map((v, i) => (
        <i key={i} style={{
          height: Math.max(2, v * height),
          opacity: i / count <= progress ? 1 : (tall ? 0.4 : 0.45),
        }}/>
      ))}
    </span>
  );
}

function PathBTriage() {
  const [status, setStatus] = useState('all');
  const [source, setSource] = useState('all');
  const [selectedId, setSelectedId] = useState(TRIAGE_VOICES[2].id);
  const selected = TRIAGE_VOICES.find(v => v.id === selectedId);

  const filtered = TRIAGE_VOICES.filter(v => {
    if (status === 'unheard' && !v.unread) return false;
    if (status === 'needs' && !v.needsReply) return false;
    if (source !== 'all' && v.source !== source) return false;
    return true;
  });

  return (
    <div className="h-full grid grid-cols-[1fr_460px]">
      {/* Left — stream */}
      <div className="flex flex-col border-r pulse-border-color overflow-hidden">
        <div className="flex items-center gap-2 px-5 py-3 border-b pulse-border-color">
          <div className="flex items-center gap-1 p-0.5 rounded-md pulse-surface-raised">
            {[
              { id: 'all',     label: 'All' },
              { id: 'unheard', label: 'Unheard' },
              { id: 'needs',   label: 'Needs reply' },
            ].map(s => (
              <button key={s.id} onClick={() => setStatus(s.id)}
                className={`px-2.5 py-1 rounded text-[11px] font-medium transition ${status === s.id ? 'pulse-surface pulse-ink-color' : 'pulse-ink-3-color'}`}>
                {s.label}
              </button>
            ))}
          </div>
          <select value={source} onChange={e => setSource(e.target.value)} className="px-2 py-1 rounded-md text-[11px] pulse-surface-raised pulse-ink-color border-0 outline-none">
            <option value="all">From any source</option>
            <option value="direct">Direct only</option>
            <option value="channel">Channels only</option>
            <option value="notes">Notes only</option>
          </select>
          <span className="ml-auto text-[10px] font-mono-pulse pulse-ink-3-color tracking-wide-mono">{filtered.length} VOICES</span>
        </div>
        <div className="flex-1 overflow-y-auto py-2">
          {filtered.map(v => (
            <div key={v.id} data-active={v.id === selectedId} onClick={() => setSelectedId(v.id)}
              className="selectable-row mx-2 px-3 py-3 rounded-lg flex items-start gap-3 cursor-pointer">
              <div className="w-10 h-10 rounded-full flex items-center justify-center text-xs font-semibold text-white shrink-0" style={{ background: colorForId(v.sender) }}>{initials(v.sender)}</div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <span className="text-[13px] font-semibold pulse-ink-color truncate">{v.sender}</span>
                  {v.unread && <span className="w-1.5 h-1.5 rounded-full pulse-rose-bg-color shrink-0"/>}
                  <span className="ml-auto text-[10px] font-mono-pulse pulse-ink-3-color shrink-0">{v.ago}</span>
                </div>
                <div className="flex items-center gap-2 mt-1">
                  <Waveform seed={v.id} height={14} count={24} className="pulse-ink-2-color"/>
                  <span className="text-[10px] font-mono-pulse pulse-ink-3-color">{v.dur}</span>
                </div>
                <div className="text-[12px] pulse-ink-2-color line-clamp-2 mt-1 leading-snug">{v.transcript || (v.aiSummary ? 'No transcript — AI summary available.' : 'No transcript.')}</div>
                {v.needsReply && (
                  <div className="inline-flex items-center gap-1 mt-1.5 px-1.5 py-0.5 rounded pulse-rose-bg-soft-color">
                    <span className="w-1 h-1 rounded-full pulse-rose-bg-color"/>

  );

/* ════════════════════════════════════════════════════════════════════════
   ════════════════════════════════════════════════════════════════════════
   PATH C — VOICE STUDIO  (Experimental · waveform-native, media-app feel)
   IA fix: replace horizontal 6-tab strip with a vertical sources rail
           inside Relay. Triage becomes "Inbox" (smart playlist). Persistent
           studio footer player at the bottom. Big floating mic, not a pill.
   ════════════════════════════════════════════════════════════════════════
   ════════════════════════════════════════════════════════════════════════ */

const C_RAIL = [
  { id: 'triage',    label: 'Inbox',     icon: 'inbox',    desc: 'Smart playlist' },
  { id: 'direct',    label: 'Direct',    icon: 'user',     desc: '1:1 voice' },
  { id: 'channel',   label: 'Channels',  icon: 'hash',     desc: 'Team voice' },
  { id: 'broadcast', label: 'Broadcast', icon: 'radio',    desc: 'One to many' },
  { id: 'notes',     label: 'Notes',     icon: 'edit',     desc: 'Personal' },
  { id: 'live',      label: 'Live',      icon: 'live',     desc: 'Rooms' },
];

function PathC({ subsection, setSubsection }) {
  const [nowPlaying, setNowPlaying] = useState(TRIAGE_VOICES[2]);
  const [isPlaying, setIsPlaying] = useState(true);
  const [progress, setProgress] = useState(0.34);
  const [isRecording, setIsRecording] = useState(false);
  const [recordingSec, setRecordingSec] = useState(0);
  const [railCollapsed, setRailCollapsed] = useState(false);

  // Animate playback progress so the active card + footer + transcript karaoke
  // all stay in sync. Loops 0 → 1 in ~12s; pauses on isPlaying=false.
  useEffect(() => {
    if (!isPlaying || isRecording) return;
    const id = setInterval(() => {
      setProgress(p => (p >= 0.98 ? 0 : Math.min(1, p + 0.008)));
    }, 100);
    return () => clearInterval(id);
  }, [isPlaying, isRecording]);

  // Recording timer — increments while isRecording is true.
  useEffect(() => {
    if (!isRecording) return;
    const id = setInterval(() => setRecordingSec(s => s + 1), 1000);
    return () => clearInterval(id);
  }, [isRecording]);

  const onPlay = (v) => {
    setNowPlaying(v);
    setProgress(0);
    setIsPlaying(true);
  };
  const onToggleRecording = () => {
    if (isRecording) {
      setIsRecording(false);
      setRecordingSec(0);
    } else {
      setIsRecording(true);
      setIsPlaying(false);
    }
  };

  const railWidth = railCollapsed ? 64 : 200;

  return (
    <div className="h-full flex flex-col">
      <AboutPath name="C Voice Studio"
        archetype="Voice Memos / pro audio — media app, not chat app."
        iaFix="Top 6-tab strip replaced by vertical sources rail. Triage → Inbox (smart playlist of all sources). Persistent studio footer player. Floating mic, not a pill."
        vibe="Waveform-native. Full-width audio cards. Karaoke-style transcript on play. Coral reserved for record indicator + AI + active source." />

      <div className="flex-1 flex overflow-hidden relative">
        {/* Sources rail (collapsible) */}
        <aside className="shrink-0 border-r pulse-border-color overflow-y-auto py-2 relative transition-[width] duration-200" style={{ width: railWidth }}>
          <div className={`flex items-center px-3 py-2 ${railCollapsed ? 'justify-center' : 'justify-between'}`}>
            {!railCollapsed && <span className="text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color">SOURCES</span>}
            <button onClick={() => setRailCollapsed(c => !c)} className="p-1 rounded hover:pulse-surface-raised pulse-ink-3-color" title={railCollapsed ? 'Expand rail' : 'Collapse rail'}>
              <Icon name={railCollapsed ? 'chevR' : 'chevD'} className={`w-3.5 h-3.5 ${railCollapsed ? '' : 'rotate-90'}`}/>
            </button>
          </div>
          {C_RAIL.map(r => (
            <button key={r.id} data-section={r.id} onClick={() => setSubsection(r.id)}
              title={railCollapsed ? `${r.label} — ${r.desc}` : undefined}
              className={`w-full flex items-center transition text-left ${railCollapsed ? 'justify-center px-0 py-3' : 'gap-3 px-4 py-2.5'} ${subsection === r.id ? 'pulse-rose-color pulse-rose-bg-soft-color' : 'pulse-ink-2-color hover:pulse-surface-raised'}`}>
              <div className="relative shrink-0">
                <Icon name={r.icon} className="w-4 h-4 opacity-90"/>
                {railCollapsed && r.id === 'triage' && <span className="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full pulse-rose-bg-color pulse-dot-anim"/>}
              </div>
              {!railCollapsed && (
                <>
                  <div className="min-w-0">
                    <div className="text-[13px] font-medium">{r.label}</div>
                    <div className="text-[10px] pulse-ink-3-color">{r.desc}</div>
                  </div>
                  {r.id === 'triage' && <span className="ml-auto w-1.5 h-1.5 rounded-full pulse-rose-bg-color pulse-dot-anim"/>}
                </>
              )}
            </button>
          ))}
          {!railCollapsed && (
            <>
              <div className="px-4 py-2 mt-4 text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color">SMART PLAYLISTS</div>
              {[
                { label: 'Unheard',     count: 3 },
                { label: 'Needs reply', count: 1 },
                { label: 'Bookmarked',  count: 12 },
                { label: 'Today',       count: 6 },
              ].map(p => (
                <button key={p.label} className="w-full flex items-center gap-2 px-4 py-1.5 pulse-ink-2-color hover:pulse-surface-raised text-[12px] text-left">
                  <Icon name="bookmark" className="w-3.5 h-3.5 opacity-60"/>
                  <span>{p.label}</span>
                  <span className="ml-auto text-[10px] font-mono-pulse pulse-ink-3-color">{p.count}</span>
                </button>
              ))}
            </>
          )}
        </aside>

        {/* Main */}
        <div className="flex-1 flex flex-col overflow-hidden relative">
          {isRecording && <div className="absolute inset-0 pointer-events-none z-10" style={{ background: 'var(--pulse-dim-overlay)' }}/>}
          <div className={`flex-1 overflow-y-auto px-7 pt-6 pb-28 transition-opacity ${isRecording ? 'opacity-40' : ''}`}>
            {subsection === 'triage'    && <PathCInbox nowPlaying={nowPlaying} progress={progress} isPlaying={isPlaying} onPlay={onPlay} onTogglePlay={() => setIsPlaying(p => !p)} />}
            {subsection === 'direct'    && <PathCDirect nowPlaying={nowPlaying} onPlay={onPlay} />}
            {subsection === 'channel'   && <PathCChannel nowPlaying={nowPlaying} onPlay={onPlay} />}
            {subsection === 'broadcast' && <PathCBroadcast nowPlaying={nowPlaying} progress={progress} isPlaying={isPlaying} onPlay={onPlay} />}
            {subsection === 'notes'     && <PathCNotes nowPlaying={nowPlaying} onPlay={onPlay} />}
            {subsection === 'live'      && <PathCLive />}
          </div>

          {/* Studio footer — switches between idle / playing / recording modes */}
          <StudioFooter v={nowPlaying} isPlaying={isPlaying} progress={progress} isRecording={isRecording} recordingSec={recordingSec} onTogglePlay={() => setIsPlaying(p => !p)} onCancelRecord={onToggleRecording} onSendRecord={onToggleRecording} />
        </div>
      </div>

      {/* Floating mic — record affordance, swaps to stop while recording */}
      <button
        onClick={onToggleRecording}
        className={`absolute bottom-24 right-6 w-14 h-14 rounded-full flex items-center justify-center transition ${isRecording ? 'bg-red-500 text-white' : 'pulse-rose-bg-color text-white pulse-rose-glow-shadow ring-pulse-anim'}`}
        style={{ position: 'absolute', zIndex: 20 }}
        title={isRecording ? 'Stop recording' : 'Hold space to record'}>
        <Icon name={isRecording ? 'pause' : 'mic'} className="w-6 h-6"/>
      </button>
    </div>
  );
}

function StudioFooter({ v, isPlaying, progress, isRecording, recordingSec, onTogglePlay, onCancelRecord, onSendRecord }) {
  if (isRecording) {
    const mm = String(Math.floor(recordingSec / 60)).padStart(1, '0');
    const ss = String(recordingSec % 60).padStart(2, '0');
    return (
      <div className="border-t-2 border-red-500 px-6 py-4 flex items-center gap-4 relative z-20" style={{ background: 'var(--pulse-canvas-soft)' }}>
        <div className="flex items-center gap-2 shrink-0">
          <span className="w-2.5 h-2.5 rounded-full bg-red-500 pulse-dot-anim"/>
          <span className="text-[11px] font-mono-pulse tracking-wide-mono text-red-500">RECORDING</span>
        </div>
        <div className="flex-1 flex items-center gap-3 min-w-0">
          <span className="font-mono-pulse text-base text-red-500">{mm}:{ss}</span>
          {/* Live waveform — animated bars driven by wave-live-bar keyframes */}
          <div className="flex items-end gap-0.5 flex-1 h-7">
            {Array.from({ length: 60 }).map((_, i) => (
              <i key={i} className="wave-live-bar block" style={{
                width: 2,
                height: `${30 + (Math.sin((i + recordingSec) * 0.5) * 0.5 + 0.5) * 70}%`,
                background: '#ef4444',
                borderRadius: 1,
                animationDelay: `${(i % 6) * 0.08}s`,
              }}/>
            ))}
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <button onClick={onCancelRecord} className="px-3 py-1.5 rounded-md pulse-surface-raised text-[12px] pulse-ink-2-color">Cancel</button>
          <button onClick={onSendRecord} className="px-4 py-1.5 rounded-md bg-red-500 text-white text-[12px] font-medium flex items-center gap-1.5">
            <Icon name="pause" className="w-3.5 h-3.5"/>Stop & send
          </button>
        </div>
      </div>
    );
  }

  if (!v) {
    return (
      <div className="border-t pulse-border-color px-6 py-4 flex items-center gap-3" style={{ background: 'var(--pulse-canvas-soft)' }}>
        <span className="w-2 h-2 rounded-full pulse-ink-3-color" style={{ background: 'var(--pulse-ink-3)' }}/>
        <span className="text-[12px] pulse-ink-3-color">Nothing playing — hit space to record, or pick a voice from the rail.</span>
      </div>
    );
  }

  const pct = Math.round(progress * 100);
  const totalSec = parseDur(v.dur);
  const curSec = Math.floor(totalSec * progress);
  const cur = `${Math.floor(curSec / 60)}:${String(curSec % 60).padStart(2, '0')}`;

  return (
    <div className="border-t pulse-border-color px-6 py-3 flex items-center gap-4" style={{ background: 'var(--pulse-canvas-soft)' }}>
      <button onClick={onTogglePlay} className="w-11 h-11 rounded-full pulse-rose-bg-color text-white pulse-rose-glow-shadow flex items-center justify-center shrink-0">
        <Icon name={isPlaying ? 'pause' : 'play'} className="w-5 h-5"/>
      </button>
      <div className="flex-1 min-w-0">
        <div className="flex items-baseline gap-2">
          <span className="text-[13px] font-semibold pulse-ink-color truncate">{v.sender}</span>
          <span className="text-[10px] font-mono-pulse pulse-ink-3-color">{TYPE_LABELS[v.type].label}</span>
          {isPlaying && <span className="flex items-center gap-1 text-[10px] font-mono-pulse pulse-rose-color"><span className="w-1 h-1 rounded-full pulse-rose-bg-color pulse-dot-anim"/>PLAYING</span>}
          <span className="ml-auto text-[10px] font-mono-pulse pulse-ink-3-color">{cur} / {v.dur}</span>
        </div>
        <div className="flex items-center gap-2 mt-1.5 relative">
          <Waveform seed={v.id} height={22} count={120} className="pulse-rose-color" progress={progress}/>
          <div className="absolute inset-y-0 pointer-events-none" style={{ left: `${pct}%`, width: 1, background: 'var(--pulse-rose)', opacity: isPlaying ? 1 : 0.5 }}/>
        </div>
      </div>
      <div className="flex items-center gap-1.5 shrink-0">
        <button className="px-2 py-1 rounded-md pulse-surface-raised text-[10px] font-mono-pulse pulse-ink-2-color">1.0×</button>
        <button className="p-2 rounded-md hover:pulse-surface-raised pulse-coral-fg-color" title="AI summary"><Icon name="sparkles" className="w-4 h-4"/></button>
        <button className="p-2 rounded-md hover:pulse-surface-raised pulse-ink-2-color" title="Bookmark"><Icon name="bookmark" className="w-4 h-4"/></button>
        <button className="p-2 rounded-md hover:pulse-surface-raised pulse-ink-2-color" title="Volume"><Icon name="volume" className="w-4 h-4"/></button>
      </div>
    </div>
  );
}

// "0:19" → 19 (seconds). Used for footer progress timestamp.
function parseDur(d) {
  const [m, s] = (d || '0:00').split(':').map(Number);
  return (m || 0) * 60 + (s || 0);
}

        </div>
      </div>
    </div>
  );
}

function PathCNotes() {
  return (
    <div>
      <header className="mb-5">
        <div className="text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color">PERSONAL NOTES</div>
        <h1 className="text-3xl font-semibold pulse-ink-color mt-1 leading-tight">Voice notes</h1>
        <div className="text-[12px] pulse-ink-3-color mt-1">Personal · never shared · auto-transcribed</div>
      </header>
      <div className="space-y-3">
        {NOTES_TIMELINE.map(n => (
          <div key={n.id} className="studio-card p-4">
            <div className="flex items-center gap-3 mb-2">
              <div className="w-8 h-8 rounded-lg pulse-surface-raised flex items-center justify-center pulse-ink-2-color"><Icon name="edit" className="w-4 h-4"/></div>
              <span className="text-[13px] font-semibold pulse-ink-color">{n.title}</span>
              <span className="ml-auto text-[10px] font-mono-pulse pulse-ink-3-color">{n.when} · {n.dur}</span>
            </div>
            <div className="flex items-center gap-3">
              <button className="w-9 h-9 rounded-full pulse-surface-raised pulse-ink-color flex items-center justify-center"><Icon name="play" className="w-3.5 h-3.5"/></button>
              <Waveform seed={n.id} height={24} count={60} className="pulse-ink-2-color" tall/>
            </div>
            {n.transcript && n.transcript !== '.' && (
              <div className="text-[13px] pulse-ink-color mt-2 leading-relaxed" style={{ paddingLeft: 48 }}>{n.transcript}</div>
            )}
            {n.tags.length > 0 && (
              <div className="flex items-center gap-1.5 mt-2" style={{ paddingLeft: 48 }}>
                {n.tags.map(t => <span key={t} className="px-1.5 py-0.5 rounded text-[9px] font-mono-pulse tracking-wide-mono pulse-surface-raised pulse-ink-3-color">#{t.toUpperCase()}</span>)}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function PathCLive() {
  return (
    <div>
      <header className="mb-5">
        <div className="text-[10px] font-mono-pulse tracking-wide-mono pulse-rose-color flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full pulse-rose-bg-color pulse-dot-anim"/>LIVE NOW · 2 ROOMS</div>
        <h1 className="text-3xl font-semibold pulse-ink-color mt-1 leading-tight">Voice rooms</h1>
        <div className="text-[12px] pulse-ink-3-color mt-1">Drop in. Talk over voice. Walk away.</div>
      </header>
      <div className="grid grid-cols-2 gap-4">
        {VOICE_ROOMS.map(r => (
          <div key={r.id} className="studio-card p-5 cursor-pointer">
            <div className="flex items-center gap-2 mb-3">
              <span className="w-2 h-2 rounded-full pulse-dot-anim" style={{ background: r.live ? 'var(--pulse-rose)' : 'var(--pulse-ink-3)' }}/>
              <span className="text-[10px] font-mono-pulse tracking-wide-mono" style={{ color: r.live ? 'var(--pulse-rose)' : 'var(--pulse-ink-3)' }}>{r.live ? 'LIVE' : 'EMPTY'}</span>
              <span className="ml-auto text-[10px] font-mono-pulse pulse-ink-3-color">{r.total} present</span>
            </div>
            <div className="text-xl font-semibold pulse-ink-color">{r.name}</div>
            <div className="text-[12px] pulse-ink-3-color mt-0.5">{r.live ? `Hosted by ${r.host}` : 'No one yet'}</div>
            {r.live && (
              <>
                <div className="mt-4 flex items-end gap-1" style={{ height: 28 }}>
                  {[0.4, 0.7, 0.5, 0.9, 0.6, 0.85, 0.4, 0.7, 0.55].map((v, i) => (
                    <i key={i} className="wave-live-bar block" style={{ width: 3, height: v * 28, background: r.color, borderRadius: 1.5, animationDelay: `${i * 0.08}s` }}/>
                  ))}
                  <button className="ml-auto px-3 py-1.5 rounded-md pulse-rose-bg-color text-white text-[11px] font-medium">Join room</button>
                </div>
              </>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   PLAYGROUND SHELL — top bar + path switcher + theme toggle
   ════════════════════════════════════════════════════════════════════════ */

function App() {
  const [theme, setTheme] = useState('dark');
  const [path, setPath] = useState('A');
  const [subsection, setSubsection] = useState('triage');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  return (
    <div className="h-screen w-screen flex flex-col overflow-hidden pulse-bg">
      {/* Playground top bar */}
      <div className="pg-bar flex items-center gap-3 px-4 py-2 border-b pulse-border-color shrink-0" style={{ height: 48 }}>
        <div className="flex items-center gap-2">
          <div className="w-6 h-6 rounded-md pulse-rose-bg-color flex items-center justify-center text-white"><Icon name="sparkles" className="w-3.5 h-3.5"/></div>
          <span className="text-sm font-semibold pulse-ink-color">Relay Redesign</span>
          <span className="text-[10px] font-mono-pulse tracking-wide-mono pulse-ink-3-color">· PLAYGROUND</span>
        </div>

        <div className="ml-6 flex items-center gap-1 p-0.5 rounded-lg pulse-surface-raised">
          {[
            { id: 'A', label: 'A · Refined Triage' },
            { id: 'B', label: 'B · Stream + Spotlight' },
            { id: 'C', label: 'C · Voice Studio' },
          ].map(p => (
            <button key={p.id} data-active={path === p.id} onClick={() => setPath(p.id)}
              className="pg-pill px-3 py-1.5 rounded-md text-[12px] font-medium pulse-ink-2-color">
              {p.label}
            </button>
          ))}
        </div>

        <div className="ml-auto flex items-center gap-1">
          <button onClick={toggleTheme} className="px-2.5 py-1.5 rounded-md text-[11px] font-mono-pulse tracking-wide-mono pulse-ink-2-color hover:pulse-surface-raised flex items-center gap-1.5">
            <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-3.5 h-3.5"/>
            {theme === 'dark' ? 'LIGHT' : 'DARK'}
          </button>
          <a href="https://github.com" className="hidden" aria-hidden="true"/>
        </div>
      </div>

      {/* App body */}
      <div className="flex-1 flex overflow-hidden">
        <PulseSidebar theme={theme} onToggleTheme={toggleTheme}/>
        <main className="flex-1 overflow-hidden m-3 rounded-2xl border pulse-border-color pulse-bg-soft relative" style={{ boxShadow: 'var(--pulse-shadow-main)' }}>
          {path === 'A' && <PathA subsection={subsection} setSubsection={setSubsection}/>}
          {path === 'B' && <PathB subsection={subsection} setSubsection={setSubsection}/>}
          {path === 'C' && <PathC subsection={subsection} setSubsection={setSubsection}/>}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
