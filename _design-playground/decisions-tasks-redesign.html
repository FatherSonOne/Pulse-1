function buildQueue() {
  const dq = DECISIONS.filter(d=>d.status==='voting'&&!d.youVoted).map(d=>({ ...d, kind:'decision' }));
  const overdue = TASKS.filter(t=>t.due&&t.due.overdue&&t.status!=='done').map(t=>({...t,kind:'task'}));
  const blocked = TASKS.filter(t=>t.status==='blocked'&&!(t.due&&t.due.overdue)).map(t=>({...t,kind:'task'}));
  const today = TASKS.filter(t=>['in_review','in_progress'].includes(t.status)&&!(t.due&&t.due.overdue)).map(t=>({...t,kind:'task'}));
  const upcoming = TASKS.filter(t=>t.status==='todo'&&!(t.due&&t.due.overdue)).map(t=>({...t,kind:'task'}));
  return [
    { label:'Needs you', tone:'var(--st-overdue)', items:[...dq, ...overdue, ...blocked] },
    { label:'Today', tone:'var(--st-progress)', items: today },
    { label:'Upcoming', tone:'var(--st-todo)', items: upcoming },
  ];
}

        <div><div className="lbl ink-3 mb-1.5">Priority</div><div className="flex items-center gap-1 h-10 px-1.5 rounded-md surface border bd">{['low','medium','high'].map(p=>(<span key={p} className="ptag" style={{ flex:1, textAlign:'center', padding:'5px 0', background: p==='medium'?'var(--pulse-surface-raised)':'transparent', color: p==='medium'?'var(--pulse-ink)':'var(--pulse-ink-3)', cursor:'pointer' }}>{p}</span>))}</div></div>
      </div>
      <div className="flex items-center justify-between pt-4 border-t bd"><span className="lbl-s ink-3 flex items-center gap-1.5"><span className="keycap">⌘</span><span className="keycap">⏎</span> to create</span><button className="inline-flex items-center gap-1.5 h-9 px-4 rounded-md text-[12.5px] font-semibold" style={{ background:'var(--pulse-rose)', color:'#fff' }}><Ic n="plus" size={14} /> Create task</button></div>
    </div>
  );
}
function CreateAI() {
  return (
    <div className="px-5 py-5">
      <div className="rounded-lg px-4 py-4 mb-4" style={{ background:'var(--pulse-coral-bg-08)', border:'1px solid var(--pulse-rose-soft)' }}><div className="flex items-center gap-2 mb-2.5"><AiChip>Pulse AI</AiChip><span className="lbl ink-3">Decision Mission</span></div><p className="text-[13px] leading-relaxed" style={{ color:'var(--pulse-coral-fg)' }}>Talk it through. I'll pull context from across your surfaces — Email, Messages, Meetings, Relay — frame the call, surface risks, and draft the tasks it spawns.</p></div>
      <div className="lbl ink-3 mb-2">Start from</div>
      <div className="space-y-2 mb-4">{['Should we keep the weekly all-hands or move async?','Which onboarding flow converts better — guided vs self-serve?','Pick the launch date for the v1 public beta'].map((s,i)=>(<button key={i} className="w-full text-left rounded-md px-3.5 py-2.5 surface border bd lift flex items-center gap-2.5"><Ic n="sparkles" size={14} cls="pulse-rose-color flex-none" /><span className="text-[13px] ink-2">{s}</span><Ic n="arrowRight" size={14} cls="ink-3 ml-auto" /></button>))}</div>
      <div className="flex items-center gap-2"><input className="flex-1 h-10 px-3 rounded-md surface border bd text-[13px] ink" placeholder="Describe the decision you're facing…" /><button className="inline-flex items-center justify-center rounded-md" style={{ width:40, height:40, background:'var(--pulse-rose)', color:'#fff' }}><Ic n="send" size={16} /></button></div>
    </div>
  );
}

/* ════════ APP SHELL ════════ */
const PG_VIEWS = [ { id:'triage', label:'Triage Cockpit', icon:'inbox' }, { id:'archive', label:'Archive', icon:'archive' }, { id:'create', label:'Create flow', icon:'plus' }, { id:'empty', label:'Caught up', icon:'checkCircle' } ];
function App() {
  const [tab, setTab] = useState('triage');
  const [overlay, setOverlay] = useState(null);
  const [demoEmpty, setDemoEmpty] = useState(false);
  const [theme, setThemeState] = useState('dark');
  const setTheme = t => { setThemeState(t); document.documentElement.setAttribute('data-theme', t); };
  useEffect(()=>{ document.documentElement.setAttribute('data-theme', theme); }, []);
  const setView = v => {
    if (v==='create') { setOverlay('create'); return; }
    if (v==='empty') { setTab('triage'); setOverlay(null); setDemoEmpty(true); return; }
    setTab(v); setOverlay(null); setDemoEmpty(false);
  };
  const pickTab = t => { setTab(t); setDemoEmpty(false); };
  const activeView = demoEmpty ? 'empty' : overlay==='create' ? 'create' : tab;

  return (
    <div className="h-screen flex flex-col">
      <div className="pg-bar flex items-center px-4 gap-3 flex-none">
        <div className="flex items-center gap-2 pr-3 mr-1 border-r bd"><span className="inline-flex items-center justify-center rounded-md" style={{ width:20, height:20, background:'var(--pulse-rose)' }}><Ic n="checkSquare" size={12} cls="text-white" /></span><span className="text-[12px] font-semibold ink">Decisions &amp; Tasks · Triage Cockpit</span><span className="lbl ink-3 ml-1">Playground</span></div>
        <div className="flex items-center gap-1.5">{PG_VIEWS.map(p=>(<button key={p.id} className="pg-pill" data-view={p.id} data-active={activeView===p.id} onClick={()=>setView(p.id)}><Ic n={p.icon} size={14} /> <span>{p.label}</span></button>))}</div>
        <div className="flex-1" />
        <button className="theme-toggle" onClick={()=>setTheme(theme==='dark'?'light':'dark')}>{theme==='dark'?'● DARK':'○ LIGHT'}</button>
      </div>
      <div className="flex-1 flex min-h-0">
        <Sidebar theme={theme} setTheme={setTheme} />
        <main className="flex-1 min-w-0 overflow-hidden">
          {tab==='triage' ? <TriageView tab={tab} setTab={pickTab} onCreate={()=>setOverlay('create')} empty={demoEmpty} /> : <ArchiveView tab={tab} setTab={pickTab} onCreate={()=>setOverlay('create')} />}
        </main>
      </div>
      {overlay==='create' && <CreateOverlay onClose={()=>setOverlay(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
