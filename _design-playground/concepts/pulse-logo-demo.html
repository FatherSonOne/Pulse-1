<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — 3D Logo Design Lab</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { background: #050510; }
  #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  #canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }

  /* Flash overlay */
  #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; pointer-events: none; background: #fff; opacity: 0; transition: opacity 0.15s ease; }

  /* Top bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; padding: 18px 28px;
    background: linear-gradient(to bottom, rgba(5,5,16,0.95) 0%, rgba(5,5,16,0) 100%);
  }
  #wordmark {
    font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 50%, #34d399 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    user-select: none;
  }
  #lab-label {
    margin-left: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.35); text-transform: uppercase; padding-top: 2px;
    user-select: none;
  }

  /* Right controls */
  #controls {
    position: fixed; top: 80px; right: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ctrl-btn {
    width: 42px; height: 42px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(10,10,30,0.75); backdrop-filter: blur(12px);
    color: rgba(255,255,255,0.7); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .ctrl-btn:hover { background: rgba(30,30,70,0.9); border-color: rgba(255,255,255,0.25); color: #fff; }
  .ctrl-btn.active { background: rgba(167,139,250,0.25); border-color: rgba(167,139,250,0.5); color: #a78bfa; }

  /* Left speed slider */
  #speed-panel {
    position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
    z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #speed-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); text-transform: uppercase; user-select: none; }
  #speed-slider {
    -webkit-appearance: none; appearance: none;
    writing-mode: vertical-lr; direction: rtl;
    width: 4px; height: 120px; outline: none; border: none;
    background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer;
  }
  #speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #a78bfa; border: 2px solid rgba(255,255,255,0.4); cursor: pointer;
    box-shadow: 0 0 8px rgba(167,139,250,0.6);
  }
  #speed-value { font-size: 11px; color: rgba(255,255,255,0.4); user-select: none; }

  /* Bottom info panel */
  #info-panel {
    position: fixed; bottom: 100px; left: 28px; z-index: 10;
    max-width: 260px;
  }
  #variant-name { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  #variant-desc { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.5; margin-bottom: 10px; }
  #color-palette { display: flex; gap: 6px; }
  .color-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); }

  /* Bottom tabs */
  #tabs {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 6px;
    background: rgba(10,10,30,0.8); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 50px;
    padding: 6px 8px;
  }
  .tab-btn {
    padding: 8px 18px; border-radius: 40px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    color: rgba(255,255,255,0.5); background: transparent;
    transition: background 0.25s, color 0.25s;
    white-space: nowrap;
  }
  .tab-btn:hover { color: rgba(255,255,255,0.85); }
  .tab-btn.active { background: rgba(167,139,250,0.2); color: #a78bfa; }
</style>
</head>
<body>

<div id="flash"></div>
<div id="canvas-container"></div>

<div id="topbar">
  <div id="wordmark">Pulse</div>
  <div id="lab-label">3D Logo Design Lab</div>
</div>

<div id="controls">
  <button class="ctrl-btn active" id="btn-rotate" title="Toggle Auto-Rotate">&#9654;</button>
  <button class="ctrl-btn" id="btn-wire" title="Toggle Wireframe">&#9638;</button>
  <button class="ctrl-btn" id="btn-bg" title="Toggle Background">&#9680;</button>
  <button class="ctrl-btn" id="btn-shot" title="Download Screenshot">&#8681;</button>
</div>

<div id="speed-panel">
  <div id="speed-label">Speed</div>
  <input type="range" id="speed-slider" min="10" max="300" value="100">
  <div id="speed-value">1.0x</div>
</div>

<div id="info-panel">
  <div id="variant-name"></div>
  <div id="variant-desc"></div>
  <div id="color-palette"></div>
</div>

<div id="tabs"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  // ── Variant definitions ──────────────────────────────────────────────────
  var VARIANTS = [
    {
      id: 'wave',
      label: 'Pulse Wave',
      desc: 'Torus rings pulse outward from a sphere core with circular audio bars and a floating P letterform.',
      primary: 0xa78bfa, secondary: 0x60a5fa, accent: 0x34d399,
      bg: '#050510', bgDark: '#050510', bgLight: '#e8e0ff'
    },
    {
      id: 'neural',
      label: 'Neural Net',
      desc: 'Nodes form a P silhouette, connected by dynamic lines that oscillate in 3D space.',
      primary: 0x60a5fa, secondary: 0x34d399, accent: 0xf59e0b,
      bg: '#030d1a', bgDark: '#030d1a', bgLight: '#dff0ff'
    },
    {
      id: 'crystal',
      label: 'Crystal P',
      desc: 'A bold block-letter P built from crystal box segments, surrounded by floating octahedron shards.',
      primary: 0xf472b6, secondary: 0xa78bfa, accent: 0x60a5fa,
      bg: '#0d050f', bgDark: '#0d050f', bgLight: '#ffe8f8'
    },
    {
      id: 'orbit',
      label: 'Orbit Ring',
      desc: 'An icosahedron core with four orbital torus rings and 60 particles in elliptical paths.',
      primary: 0x34d399, secondary: 0x60a5fa, accent: 0xa78bfa,
      bg: '#030f0a', bgDark: '#030f0a', bgLight: '#dcfff2'
    },
    {
      id: 'helix',
      label: 'Helix',
      desc: 'Twin helical strands offset by PI, dotted with glowing sphere nodes and cross-rung connectors.',
      primary: 0xfbbf24, secondary: 0xf87171, accent: 0xa78bfa,
      bg: '#0f0a03', bgDark: '#0f0a03', bgLight: '#fffae0'
    }
  ];

  // ── State ────────────────────────────────────────────────────────────────
  var currentVariant = 0;
  var autoRotate = true;
  var wireframe = false;
  var lightBg = false;
  var speedMult = 1.0;
  var isDragging = false;
  var prevMouse = { x: 0, y: 0 };
  var groupRotation = { x: 0, y: 0 };

  // ── Three.js core ────────────────────────────────────────────────────────
  var scene, camera, renderer, clock;
  var mainGroup = null;
  var lightA, lightB, lightC, ambientLight;
  var currentObjects = [];  // disposable mesh list
  var animateFunctions = []; // per-variant per-frame callbacks

  function initThree() {
    scene = new THREE.Scene();
    clock = new THREE.Clock();

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 9);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = false;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    var container = document.getElementById('canvas-container');
    container.appendChild(renderer.domElement);

    ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambientLight);

    lightA = new THREE.PointLight(0xa78bfa, 6, 30);
    lightA.position.set(6, 6, 6);
    scene.add(lightA);

    lightB = new THREE.PointLight(0x60a5fa, 4, 25);
    lightB.position.set(-6, -4, 4);
    scene.add(lightB);

    lightC = new THREE.PointLight(0x34d399, 3, 20);
    lightC.position.set(0, 6, -6);
    scene.add(lightC);

    window.addEventListener('resize', onResize);
    setupMouseEvents();
    setupScrollZoom();
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function setupMouseEvents() {
    var canvas = renderer.domElement;
    canvas.addEventListener('mousedown', function(e) {
      if (!autoRotate) {
        isDragging = true;
        prevMouse.x = e.clientX;
        prevMouse.y = e.clientY;
      }
    });
    window.addEventListener('mousemove', function(e) {
      if (isDragging && mainGroup) {
        var dx = (e.clientX - prevMouse.x) * 0.01;
        var dy = (e.clientY - prevMouse.y) * 0.01;
        groupRotation.y += dx;
        groupRotation.x += dy;
        prevMouse.x = e.clientX;
        prevMouse.y = e.clientY;
      }
    });
    window.addEventListener('mouseup', function() { isDragging = false; });
    canvas.addEventListener('touchstart', function(e) {
      if (!autoRotate && e.touches.length === 1) {
        isDragging = true;
        prevMouse.x = e.touches[0].clientX;
        prevMouse.y = e.touches[0].clientY;
      }
    });
    window.addEventListener('touchmove', function(e) {
      if (isDragging && mainGroup && e.touches.length === 1) {
        var dx = (e.touches[0].clientX - prevMouse.x) * 0.01;
        var dy = (e.touches[0].clientY - prevMouse.y) * 0.01;
        groupRotation.y += dx;
        groupRotation.x += dy;
        prevMouse.x = e.touches[0].clientX;
        prevMouse.y = e.touches[0].clientY;
      }
    });
    window.addEventListener('touchend', function() { isDragging = false; });
  }

  function setupScrollZoom() {
    window.addEventListener('wheel', function(e) {
      camera.position.z += e.deltaY * 0.01;
      camera.position.z = Math.max(3, Math.min(20, camera.position.z));
    }, { passive: true });
  }

  // ── Dispose helpers ──────────────────────────────────────────────────────
  function disposeObject(obj) {
    if (!obj) return;
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) {
        obj.material.forEach(function(m) { m.dispose(); });
      } else {
        obj.material.dispose();
      }
    }
    if (obj.children) {
      obj.children.forEach(function(c) { disposeObject(c); });
    }
  }

  function clearScene() {
    animateFunctions = [];
    if (mainGroup) {
      disposeObject(mainGroup);
      scene.remove(mainGroup);
      mainGroup = null;
    }
    currentObjects = [];
  }

  // ── Material factory ─────────────────────────────────────────────────────
  function mat(color, opts) {
    var o = opts || {};
    return new THREE.MeshStandardMaterial({
      color: color,
      metalness: o.metalness !== undefined ? o.metalness : 0.7,
      roughness: o.roughness !== undefined ? o.roughness : 0.2,
      emissive: o.emissive !== undefined ? o.emissive : color,
      emissiveIntensity: o.emissiveIntensity !== undefined ? o.emissiveIntensity : 0.15,
      wireframe: wireframe,
      transparent: o.transparent || false,
      opacity: o.opacity !== undefined ? o.opacity : 1.0
    });
  }

  function applyWireframe(val) {
    scene.traverse(function(obj) {
      if (obj.isMesh && obj.material) {
        if (Array.isArray(obj.material)) {
          obj.material.forEach(function(m) { m.wireframe = val; });
        } else {
          obj.material.wireframe = val;
        }
      }
    });
  }

  // ── Variant builders ─────────────────────────────────────────────────────

  // VARIANT 1 — Pulse Wave
  function buildWave(v) {
    var group = new THREE.Group();

    // Core sphere
    var coreGeo = new THREE.SphereGeometry(0.55, 32, 32);
    var coreMesh = new THREE.Mesh(coreGeo, mat(v.primary, { metalness: 0.9, roughness: 0.1, emissiveIntensity: 0.4 }));
    group.add(coreMesh);

    // Torus rings
    var rings = [];
    var ringData = [
      { r: 1.3, tube: 0.045, phase: 0 },
      { r: 1.8, tube: 0.035, phase: 0.5 },
      { r: 2.3, tube: 0.028, phase: 1.0 },
      { r: 2.8, tube: 0.02, phase: 1.5 }
    ];
    for (var i = 0; i < ringData.length; i++) {
      var rd = ringData[i];
      var tGeo = new THREE.TorusGeometry(rd.r, rd.tube, 16, 80);
      var col = (i % 2 === 0) ? v.primary : v.secondary;
      var tMesh = new THREE.Mesh(tGeo, mat(col, { emissiveIntensity: 0.3 }));
      tMesh.rotation.x = Math.PI / 2;
      rings.push({ mesh: tMesh, baseR: rd.r, phase: rd.phase });
      group.add(tMesh);
    }

    // Audio bars arranged in a circle
    var bars = [];
    var barCount = 32;
    for (var b = 0; b < barCount; b++) {
      var angle = (b / barCount) * Math.PI * 2;
      var radius = 1.6;
      var bGeo = new THREE.BoxGeometry(0.06, 0.25, 0.06);
      var bMesh = new THREE.Mesh(bGeo, mat(v.accent, { emissiveIntensity: 0.35 }));
      bMesh.position.x = Math.cos(angle) * radius;
      bMesh.position.z = Math.sin(angle) * radius;
      bMesh.rotation.y = -angle;
      bars.push({ mesh: bMesh, angle: angle, idx: b });
      group.add(bMesh);
    }

    // P letterform via tube
    var pPoints = [];
    // Vertical stem
    for (var pi = 0; pi <= 12; pi++) {
      pPoints.push(new THREE.Vector3(-0.55, -1.2 + pi * 0.2, 0));
    }
    // Bowl arc
    for (var pa = 0; pa <= 16; pa++) {
      var a2 = (pa / 16) * Math.PI;
      pPoints.push(new THREE.Vector3(-0.55 + Math.cos(a2) * 0.62, 1.2 - Math.sin(a2) * 0.62, 0));
    }
    var pCurve = new THREE.CatmullRomCurve3(pPoints);
    var pTubeGeo = new THREE.TubeGeometry(pCurve, 60, 0.065, 8, false);
    var pMesh = new THREE.Mesh(pTubeGeo, mat(v.secondary, { metalness: 0.8, roughness: 0.15, emissiveIntensity: 0.5 }));
    pMesh.position.z = 2.5;
    pMesh.scale.setScalar(0.85);
    group.add(pMesh);

    animateFunctions.push(function(t) {
      // Core pulse
      var pulse = 1 + 0.08 * Math.sin(t * 2.5);
      coreMesh.scale.setScalar(pulse);

      // Ring pulse
      for (var ri = 0; ri < rings.length; ri++) {
        var rng = rings[ri];
        var s = 1 + 0.12 * Math.sin(t * 1.8 + rng.phase);
        rng.mesh.scale.setScalar(s);
        rng.mesh.rotation.z = t * 0.3 * (ri % 2 === 0 ? 1 : -1);
      }

      // Audio bars
      for (var bi = 0; bi < bars.length; bi++) {
        var br = bars[bi];
        var h = 0.18 + 0.22 * Math.abs(Math.sin(t * 3.5 + br.idx * 0.35));
        br.mesh.scale.y = h / 0.25;
        br.mesh.position.y = 0;
      }

      // P float
      pMesh.rotation.y = Math.sin(t * 0.7) * 0.15;
      pMesh.position.y = Math.sin(t * 0.5) * 0.12;
    });

    return group;
  }

  // VARIANT 2 — Neural Net
  function buildNeural(v) {
    var group = new THREE.Group();

    // P-shape node positions: vertical stem + bowl
    var nodePositions = [];
    // Vertical stem
    for (var si = 0; si < 10; si++) {
      nodePositions.push(new THREE.Vector3(-0.8, -2.0 + si * 0.44, 0));
    }
    // Bowl arc (top half of P)
    for (var ai = 0; ai <= 14; ai++) {
      var a = (-Math.PI / 2) + (ai / 14) * Math.PI;
      nodePositions.push(new THREE.Vector3(-0.8 + 0.9 * Math.cos(a) + 0.9, -2.0 + 9 * 0.44 * 0.5 + 0.9 * Math.sin(a), 0));
    }
    // Fill up to 40
    while (nodePositions.length < 40) {
      var extra = nodePositions.length - 24;
      nodePositions.push(new THREE.Vector3(-0.8, -2.0 + extra * 0.44, 0.2));
    }

    var nodeMeshes = [];
    var nodeGeo = new THREE.SphereGeometry(0.095, 12, 12);
    for (var ni = 0; ni < nodePositions.length; ni++) {
      var nm = new THREE.Mesh(nodeGeo, mat(ni % 3 === 0 ? v.accent : (ni % 2 === 0 ? v.primary : v.secondary), { emissiveIntensity: 0.5, metalness: 0.6 }));
      nm.position.copy(nodePositions[ni]);
      nodeMeshes.push(nm);
      group.add(nm);
    }

    // Connection lines
    var linePositions = [];
    for (var li = 0; li < nodePositions.length; li++) {
      for (var lj = li + 1; lj < nodePositions.length; lj++) {
        if (nodePositions[li].distanceTo(nodePositions[lj]) < 0.7) {
          linePositions.push(nodePositions[li].x, nodePositions[li].y, nodePositions[li].z);
          linePositions.push(nodePositions[lj].x, nodePositions[lj].y, nodePositions[lj].z);
        }
      }
    }
    var lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    var lineMat = new THREE.LineBasicMaterial({ color: v.primary, transparent: true, opacity: 0.3 });
    var lines = new THREE.LineSegments(lineGeo, lineMat);
    group.add(lines);

    animateFunctions.push(function(t) {
      for (var ni2 = 0; ni2 < nodeMeshes.length; ni2++) {
        var base = nodePositions[ni2];
        nodeMeshes[ni2].position.x = base.x + 0.06 * Math.sin(t * 1.2 + ni2 * 0.4);
        nodeMeshes[ni2].position.y = base.y + 0.06 * Math.cos(t * 0.9 + ni2 * 0.3);
        nodeMeshes[ni2].position.z = base.z + 0.04 * Math.sin(t * 1.5 + ni2 * 0.5);
      }
      // Update lines
      var positions = lineGeo.attributes.position.array;
      var idx = 0;
      for (var li2 = 0; li2 < nodePositions.length; li2++) {
        for (var lj2 = li2 + 1; lj2 < nodePositions.length; lj2++) {
          if (nodePositions[li2].distanceTo(nodePositions[lj2]) < 0.7) {
            positions[idx++] = nodeMeshes[li2].position.x;
            positions[idx++] = nodeMeshes[li2].position.y;
            positions[idx++] = nodeMeshes[li2].position.z;
            positions[idx++] = nodeMeshes[lj2].position.x;
            positions[idx++] = nodeMeshes[lj2].position.y;
            positions[idx++] = nodeMeshes[lj2].position.z;
          }
        }
      }
      lineGeo.attributes.position.needsUpdate = true;
    });

    return group;
  }

  // VARIANT 3 — Crystal P
  function buildCrystal(v) {
    var group = new THREE.Group();

    // Block P from boxes
    var blocks = [
      // Vertical stem
      { x: -0.9, y: -1.8, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x: -0.9, y: -1.2, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x: -0.9, y: -0.6, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x: -0.9, y:  0.0, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x: -0.9, y:  0.6, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x: -0.9, y:  1.2, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x: -0.9, y:  1.8, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      // Top bar
      { x: -0.3, y:  1.8, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x:  0.3, y:  1.8, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x:  0.9, y:  1.8, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      // Bowl right side
      { x:  0.9, y:  1.2, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x:  0.9, y:  0.6, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x:  0.9, y:  0.0, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      // Bowl bottom bar
      { x:  0.3, y:  0.0, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x: -0.3, y:  0.0, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      // Mid-left connector
      { x: -0.3, y:  1.2, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x:  0.3, y:  1.2, z: 0, w: 0.4, h: 0.4, d: 0.4 },
      { x:  0.3, y:  0.6, z: 0, w: 0.4, h: 0.4, d: 0.4 },
    ];

    var blockMeshes = [];
    for (var bi = 0; bi < blocks.length; bi++) {
      var bd = blocks[bi];
      var bGeo = new THREE.BoxGeometry(bd.w * 0.9, bd.h * 0.9, bd.d * 0.9);
      var col = bi % 3 === 0 ? v.primary : (bi % 3 === 1 ? v.secondary : v.accent);
      var bMesh = new THREE.Mesh(bGeo, mat(col, { metalness: 0.85, roughness: 0.1, emissiveIntensity: 0.3 }));
      bMesh.position.set(bd.x, bd.y, bd.z);
      blockMeshes.push({ mesh: bMesh, origY: bd.y, idx: bi });
      group.add(bMesh);
    }

    // Floating shards
    var shards = [];
    var shardCount = 14;
    for (var sh = 0; sh < shardCount; sh++) {
      var sGeo = new THREE.OctahedronGeometry(0.12 + Math.random() * 0.12, 0);
      var sCol = sh % 3 === 0 ? v.primary : (sh % 3 === 1 ? v.secondary : v.accent);
      var sMesh = new THREE.Mesh(sGeo, mat(sCol, { emissiveIntensity: 0.5, metalness: 0.9, roughness: 0.05 }));
      var phi = Math.random() * Math.PI * 2;
      var theta = Math.random() * Math.PI;
      var rad = 2.2 + Math.random() * 1.2;
      sMesh.position.set(
        rad * Math.sin(theta) * Math.cos(phi),
        rad * Math.cos(theta),
        rad * Math.sin(theta) * Math.sin(phi)
      );
      shards.push({ mesh: sMesh, phi: phi, theta: theta, rad: rad, spd: 0.3 + Math.random() * 0.5, idx: sh });
      group.add(sMesh);
    }

    animateFunctions.push(function(t) {
      for (var bi2 = 0; bi2 < blockMeshes.length; bi2++) {
        var binfo = blockMeshes[bi2];
        binfo.mesh.position.y = binfo.origY + 0.04 * Math.sin(t * 1.5 + binfo.idx * 0.3);
      }
      for (var shi = 0; shi < shards.length; shi++) {
        var s = shards[shi];
        s.phi += 0.008 * s.spd * speedMult;
        var curPhi = s.phi + t * 0.3;
        s.mesh.position.x = s.rad * Math.sin(s.theta) * Math.cos(curPhi);
        s.mesh.position.z = s.rad * Math.sin(s.theta) * Math.sin(curPhi);
        s.mesh.position.y = s.rad * Math.cos(s.theta) + 0.15 * Math.sin(t * 0.8 + s.idx);
        s.mesh.rotation.x = t * s.spd;
        s.mesh.rotation.z = t * s.spd * 0.7;
      }
    });

    return group;
  }

  // VARIANT 4 — Orbit Ring
  function buildOrbit(v) {
    var group = new THREE.Group();

    // Core
    var coreGeo = new THREE.IcosahedronGeometry(0.75, 2);
    var coreMesh = new THREE.Mesh(coreGeo, mat(v.primary, { metalness: 0.9, roughness: 0.05, emissiveIntensity: 0.35 }));
    group.add(coreMesh);

    // Orbital rings
    var ringConfigs = [
      { r: 2.0, tube: 0.04, rx: 0, ry: 0, rz: 0, spd: 0.5 },
      { r: 2.2, tube: 0.03, rx: Math.PI / 3, ry: 0, rz: 0, spd: -0.4 },
      { r: 2.4, tube: 0.025, rx: Math.PI / 2, ry: Math.PI / 4, rz: 0, spd: 0.35 },
      { r: 1.8, tube: 0.035, rx: Math.PI / 6, ry: Math.PI / 3, rz: Math.PI / 5, spd: -0.6 }
    ];
    var orbRings = [];
    for (var ri = 0; ri < ringConfigs.length; ri++) {
      var rc = ringConfigs[ri];
      var rGeo = new THREE.TorusGeometry(rc.r, rc.tube, 16, 100);
      var rCol = ri % 2 === 0 ? v.secondary : v.accent;
      var rMesh = new THREE.Mesh(rGeo, mat(rCol, { emissiveIntensity: 0.25, metalness: 0.8 }));
      rMesh.rotation.set(rc.rx, rc.ry, rc.rz);
      orbRings.push({ mesh: rMesh, spd: rc.spd, initRx: rc.rx });
      group.add(rMesh);
    }

    // Particles
    var particles = [];
    var pGeo = new THREE.SphereGeometry(0.045, 8, 8);
    for (var pi2 = 0; pi2 < 60; pi2++) {
      var pMat = mat(pi2 % 3 === 0 ? v.primary : (pi2 % 3 === 1 ? v.secondary : v.accent), { emissiveIntensity: 0.6, metalness: 0.7, roughness: 0.3 });
      var pMesh = new THREE.Mesh(pGeo, pMat);
      var orbitR = 1.5 + Math.random() * 1.5;
      var orbitTilt = Math.random() * Math.PI;
      var orbitPhase = Math.random() * Math.PI * 2;
      particles.push({ mesh: pMesh, r: orbitR, tilt: orbitTilt, phase: orbitPhase, spd: 0.4 + Math.random() * 0.8 });
      group.add(pMesh);
    }

    animateFunctions.push(function(t) {
      coreMesh.rotation.y = t * 0.4;
      coreMesh.rotation.x = t * 0.2;

      for (var ri2 = 0; ri2 < orbRings.length; ri2++) {
        orbRings[ri2].mesh.rotation.y = t * orbRings[ri2].spd;
        orbRings[ri2].mesh.rotation.z = t * orbRings[ri2].spd * 0.5;
      }

      for (var pi3 = 0; pi3 < particles.length; pi3++) {
        var p = particles[pi3];
        var ang = p.phase + t * p.spd;
        p.mesh.position.x = p.r * Math.cos(ang);
        p.mesh.position.y = p.r * Math.sin(ang) * Math.sin(p.tilt);
        p.mesh.position.z = p.r * Math.sin(ang) * Math.cos(p.tilt);
      }
    });

    return group;
  }

  // VARIANT 5 — Helix
  function buildHelix(v) {
    var group = new THREE.Group();

    // Helix curve helper
    function helixCurve(offset) {
      var pts = [];
      var turns = 3;
      var height = 5;
      var helixR = 0.85;
      for (var i = 0; i <= 120; i++) {
        var t2 = i / 120;
        var angle = t2 * turns * Math.PI * 2 + offset;
        pts.push(new THREE.Vector3(
          helixR * Math.cos(angle),
          height * t2 - height / 2,
          helixR * Math.sin(angle)
        ));
      }
      return new THREE.CatmullRomCurve3(pts);
    }

    var curve1 = helixCurve(0);
    var curve2 = helixCurve(Math.PI);

    var tubeGeo1 = new THREE.TubeGeometry(curve1, 120, 0.055, 8, false);
    var tubeGeo2 = new THREE.TubeGeometry(curve2, 120, 0.055, 8, false);

    var tube1 = new THREE.Mesh(tubeGeo1, mat(v.primary, { emissiveIntensity: 0.4, metalness: 0.85 }));
    var tube2 = new THREE.Mesh(tubeGeo2, mat(v.secondary, { emissiveIntensity: 0.4, metalness: 0.85 }));
    group.add(tube1);
    group.add(tube2);

    // Nodes on helices
    var nodeGeo = new THREE.SphereGeometry(0.1, 10, 10);
    var nodes1 = [], nodes2 = [];
    var nodeCount = 18;
    for (var ni3 = 0; ni3 < nodeCount; ni3++) {
      var tParam = ni3 / (nodeCount - 1);
      var p1 = curve1.getPoint(tParam);
      var p2 = curve2.getPoint(tParam);
      var n1 = new THREE.Mesh(nodeGeo, mat(v.accent, { emissiveIntensity: 0.6, metalness: 0.7 }));
      var n2 = new THREE.Mesh(nodeGeo, mat(v.accent, { emissiveIntensity: 0.6, metalness: 0.7 }));
      n1.position.copy(p1);
      n2.position.copy(p2);
      nodes1.push({ mesh: n1, t: tParam });
      nodes2.push({ mesh: n2, t: tParam });
      group.add(n1);
      group.add(n2);
    }

    // Cross rungs
    var rungPositions = [];
    for (var ri3 = 0; ri3 < nodeCount; ri3++) {
      var rp1 = curve1.getPoint(ri3 / (nodeCount - 1));
      var rp2 = curve2.getPoint(ri3 / (nodeCount - 1));
      rungPositions.push(rp1.x, rp1.y, rp1.z, rp2.x, rp2.y, rp2.z);
    }
    var rungGeo = new THREE.BufferGeometry();
    rungGeo.setAttribute('position', new THREE.Float32BufferAttribute(rungPositions, 3));
    var rungMat = new THREE.LineBasicMaterial({ color: v.accent, transparent: true, opacity: 0.45 });
    var rungs = new THREE.LineSegments(rungGeo, rungMat);
    group.add(rungs);

    animateFunctions.push(function(t) {
      group.rotation.y = 0; // handled by mainGroup
      tube1.rotation.y = t * 0.15;
      tube2.rotation.y = t * 0.15;
      rungs.rotation.y = t * 0.15;
      for (var ni4 = 0; ni4 < nodes1.length; ni4++) {
        nodes1[ni4].mesh.rotation.y = t * 0.15;
        nodes2[ni4].mesh.rotation.y = t * 0.15;
        var scale = 1 + 0.15 * Math.abs(Math.sin(t * 2 + ni4 * 0.5));
        nodes1[ni4].mesh.scale.setScalar(scale);
        nodes2[ni4].mesh.scale.setScalar(scale);
      }
    });

    return group;
  }

  // ── Load variant ─────────────────────────────────────────────────────────
  function loadVariant(idx) {
    clearScene();
    currentVariant = idx;
    var v = VARIANTS[idx];

    // Background
    var bgColor = lightBg ? v.bgLight : v.bgDark;
    renderer.setClearColor(bgColor, 1);
    document.body.style.background = bgColor;

    // Lights
    lightA.color.setHex(v.primary);
    lightB.color.setHex(v.secondary);
    lightC.color.setHex(v.accent);

    // Build
    var builders = [buildWave, buildNeural, buildCrystal, buildOrbit, buildHelix];
    mainGroup = builders[idx](v);
    mainGroup.rotation.x = groupRotation.x;
    mainGroup.rotation.y = groupRotation.y;
    scene.add(mainGroup);

    if (wireframe) applyWireframe(true);

    // Update UI
    updateInfoPanel(idx);
    updateTabs(idx);
    updateWordmarkColor(v);
  }

  function flashTransition(callback) {
    var flash = document.getElementById('flash');
    flash.style.opacity = '0.8';
    flash.style.transition = 'opacity 0.1s ease';
    setTimeout(function() {
      callback();
      flash.style.transition = 'opacity 0.4s ease';
      flash.style.opacity = '0';
    }, 100);
  }

  function updateWordmarkColor(v) {
    var hex = function(n) { return '#' + n.toString(16).padStart(6, '0'); };
    var wm = document.getElementById('wordmark');
    wm.style.backgroundImage = 'linear-gradient(135deg, ' + hex(v.primary) + ' 0%, ' + hex(v.secondary) + ' 50%, ' + hex(v.accent) + ' 100%)';
  }

  // ── UI builders ──────────────────────────────────────────────────────────
  function buildTabs() {
    var tabsEl = document.getElementById('tabs');
    for (var i = 0; i < VARIANTS.length; i++) {
      (function(idx) {
        var btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.textContent = VARIANTS[idx].label;
        btn.setAttribute('data-idx', idx);
        btn.addEventListener('click', function() {
          if (idx === currentVariant) return;
          groupRotation = { x: 0, y: 0 };
          flashTransition(function() { loadVariant(idx); });
        });
        tabsEl.appendChild(btn);
      })(i);
    }
  }

  function updateTabs(activeIdx) {
    var btns = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < btns.length; i++) {
      if (parseInt(btns[i].getAttribute('data-idx')) === activeIdx) {
        btns[i].className = 'tab-btn active';
      } else {
        btns[i].className = 'tab-btn';
      }
    }
    // Tint active tab
    var v = VARIANTS[activeIdx];
    var hex = '#' + v.primary.toString(16).padStart(6, '0');
    var active = document.querySelector('.tab-btn.active');
    if (active) {
      active.style.color = hex;
      active.style.background = hex + '33';
    }
  }

  function updateInfoPanel(idx) {
    var v = VARIANTS[idx];
    document.getElementById('variant-name').textContent = v.label;
    document.getElementById('variant-desc').textContent = v.desc;

    var palette = document.getElementById('color-palette');
    // Remove all children safely
    while (palette.firstChild) { palette.removeChild(palette.firstChild); }
    var colors = [v.primary, v.secondary, v.accent];
    for (var ci = 0; ci < colors.length; ci++) {
      var dot = document.createElement('div');
      dot.className = 'color-dot';
      dot.style.background = '#' + colors[ci].toString(16).padStart(6, '0');
      dot.style.boxShadow = '0 0 6px ' + '#' + colors[ci].toString(16).padStart(6, '0') + '88';
      palette.appendChild(dot);
    }
  }

  function buildControls() {
    var btnRotate = document.getElementById('btn-rotate');
    var btnWire = document.getElementById('btn-wire');
    var btnBg = document.getElementById('btn-bg');
    var btnShot = document.getElementById('btn-shot');

    btnRotate.addEventListener('click', function() {
      autoRotate = !autoRotate;
      if (autoRotate) {
        btnRotate.className = 'ctrl-btn active';
      } else {
        btnRotate.className = 'ctrl-btn';
      }
    });

    btnWire.addEventListener('click', function() {
      wireframe = !wireframe;
      if (wireframe) {
        btnWire.className = 'ctrl-btn active';
      } else {
        btnWire.className = 'ctrl-btn';
      }
      applyWireframe(wireframe);
    });

    btnBg.addEventListener('click', function() {
      lightBg = !lightBg;
      if (lightBg) {
        btnBg.className = 'ctrl-btn active';
      } else {
        btnBg.className = 'ctrl-btn';
      }
      var v = VARIANTS[currentVariant];
      var bgColor = lightBg ? v.bgLight : v.bgDark;
      renderer.setClearColor(bgColor, 1);
      document.body.style.background = bgColor;
    });

    btnShot.addEventListener('click', function() {
      renderer.render(scene, camera);
      var dataURL = renderer.domElement.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = dataURL;
      a.download = 'pulse-logo-' + VARIANTS[currentVariant].id + '.png';
      a.click();
    });
  }

  function buildSpeedSlider() {
    var slider = document.getElementById('speed-slider');
    var valueEl = document.getElementById('speed-value');
    slider.addEventListener('input', function() {
      speedMult = parseInt(slider.value) / 100;
      valueEl.textContent = speedMult.toFixed(1) + 'x';
    });
  }

  // ── Render loop ───────────────────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    var delta = clock.getDelta();
    var t = clock.getElapsedTime() * speedMult;

    if (mainGroup) {
      if (autoRotate) {
        mainGroup.rotation.y += delta * 0.5 * speedMult;
        mainGroup.rotation.x += delta * 0.08 * speedMult;
      } else {
        mainGroup.rotation.x = groupRotation.x;
        mainGroup.rotation.y = groupRotation.y;
      }

      // Run variant-specific animations
      for (var i = 0; i < animateFunctions.length; i++) {
        animateFunctions[i](t);
      }
    }

    // Gently orbit lights
    lightA.position.x = 6 * Math.cos(t * 0.3);
    lightA.position.z = 6 * Math.sin(t * 0.3);
    lightB.position.x = -5 * Math.cos(t * 0.2);
    lightB.position.y = 4 * Math.sin(t * 0.25);

    renderer.render(scene, camera);
  }

  // ── Bootstrap ─────────────────────────────────────────────────────────────
  function init() {
    initThree();
    buildTabs();
    buildControls();
    buildSpeedSlider();
    loadVariant(0);
    animate();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
